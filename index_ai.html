<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile and To-do List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background-color: #151619;
            color: #eeeeee;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* การ์ดหลัก */
        .card {
            display: flex;
            width: 100%;
            max-width: 850px;
            padding: 32px;
            background-color: #202127;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        /* โปรไฟล์ด้านซ้าย */
        .profile {
            flex: 1;
            min-width: 0;
            padding: 0 25px;
            text-align: center;
        }

        .profile img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #096f26;
            object-fit: cover;
        }

        .profile h1 {
            margin: 20px 0 12px;
            font-size: 25px;
            overflow-wrap: anywhere;
        }

        .profile p {
            margin: 8px 0;
            color: #b8b8bd;
            line-height: 1.6;
        }

        .profile a {
            display: inline-block;
            margin-top: 12px;
            color: #096f26;
            font-weight: bold;
        }

        /* เส้นแบ่งกลาง */
        .todo {
            flex: 1;
            min-width: 0;
            padding: 0 0 0 32px;
            border-left: 1px solid #34353d;
        }

        .todo h2 {
            margin: 0 0 22px;
            color: #096f26;
            font-size: 24px;
        }

        /* ช่องกรอกข้อความ */
        .input-area {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        #todo-input {
            flex: 1;
            width: 0;
            min-width: 0;
            padding: 12px;
            background-color: #151619;
            color: white;
            border: 1px solid #34353d;
            border-radius: 9px;
            font-size: 14px;
        }

        #todo-input:focus {
            outline: 1px solid #096f26;
        }

        #add-btn {
            padding: 0 17px;
            background-color: #036823;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            cursor: pointer;
        }

        /* รายการ To-do */
        #todo-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #todo-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #34353d;
            color: #dedee2;
            overflow-wrap: anywhere;
        }

        #todo-list li:last-child {
            border-bottom: none;
        }

        /* ปุ่มลบ */
        .delete-btn {
            flex-shrink: 0;
            padding: 7px 12px;
            background-color: transparent;
            color: #b8b8bd;
            border: 1px solid #34353d;
            border-radius: 8px;
            cursor: pointer;
        }

        /* หน้าจอมือถือ */
        @media (max-width: 650px) {
            body {
                padding: 20px 12px;
                align-items: flex-start;
            }

            .card {
                flex-direction: column;
                gap: 30px;
                padding: 25px 20px;
            }

            .profile {
                padding: 0 5px 25px;
                border-bottom: 1px solid #34353d;
            }

            .todo {
                padding: 0;
                border-left: none;
            }

            .profile h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- การ์ดเดียวครอบทั้งโปรไฟล์และ To-do List -->
    <div class="card">

        <!-- ฝั่งซ้าย: Profile -->
        <div class="profile">

            <img src="https://i.scdn.co/image/ab67616d00001e02ffe8ad517ca19e5e1edf2ff3" alt="รูปโปรไฟล์">

            <h1>Star Chokanan</h1>

            <p>student id : 69070203</p>
            <p>IT KMITL</p>

            <p>
                My name is Star!
            </p>

            <p>

            </p>

            <a href="https://www.instagram.com/ztarckn_/" target="_blank">
                IG
            </a>

        </div>

        <!-- ฝั่งขวา: To-do List -->
        <div class="todo">

            <h2>To-do List</h2>

            <div class="input-area">
                <input type="text" id="todo-input" placeholder="พิมพ์สิ่งที่ต้องทำ...">

                <button type="button" id="add-btn">
                    เพิ่ม

            </div>

            <ul id="todo-list">

                </li>

                <li>

                </li>

                <li>

                    <button type="button" class="delete-btn">ลบ</button>
                </li>

            </ul>

        </div>

    </div>

</body>

</html>
